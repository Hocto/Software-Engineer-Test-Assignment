# Complete stack: `docker compose up --build` and nothing else.
#
# Every setting the app needs is supplied here, so the reviewer changes no PATH, no
# properties file and no local config. The app waits for both dependencies to report
# healthy — not merely started — because Flyway and the AMQP connection both fail fast
# against a backend that is still booting.
#
# Postgres and the AMQP port are deliberately NOT published to the host: the app reaches
# them over the compose network, and binding 5432/5672 is the most common way a stack
# like this fails on someone else's machine ("port is already allocated"). The two ports
# a reviewer actually needs are published, and every host port can be overridden without
# editing this file:
#
#   APP_PORT=9090 RABBITMQ_UI_PORT=15673 docker compose up --build

name: core-banking

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      # Management UI — http://localhost:15672 (guest/guest). Use it to confirm the
      # three queues exist and to read published messages.
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Flyway applies db/migration on startup, so the schema is created here.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  postgres-data:
  rabbitmq-data:
