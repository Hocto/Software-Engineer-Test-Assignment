spring:
  application:
    name: core-banking

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${SPRING_DATASOURCE_USERNAME:banking}
    password: ${SPRING_DATASOURCE_PASSWORD:banking}
    hikari:
      # Sized against Postgres max_connections and the small dev container. Beyond roughly
      # (2 x cores + effective spindles) more pool connections add contention, not throughput.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: banking-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 10s

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are rendered by GlobalExceptionHandler; never leak stack traces to clients.
    include-stacktrace: never
    include-message: never
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.tuum.banking.model.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

management:
  endpoints:
    web:
      exposure:
        # Only what the container healthcheck needs; no env/heapdump/beans over HTTP.
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.tuum.banking: ${LOG_LEVEL:INFO}
