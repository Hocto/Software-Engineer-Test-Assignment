plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tuum'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.AMAZON
    }
}

repositories {
    mavenCentral()
}

ext {
    mybatisVersion = '3.0.5'
    springdocVersion = '2.8.13'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisVersion}"

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/**
 * Testcontainers only auto-detects Docker Desktop's socket. On Colima, Rancher Desktop,
 * Podman or a rootless daemon it fails with "Could not find a valid Docker environment",
 * and the usual advice is to export DOCKER_HOST yourself — a setup step this project is
 * otherwise careful not to require.
 *
 * The Docker CLI already knows the answer, so ask it instead of guessing socket paths.
 * An explicit DOCKER_HOST always wins, and any failure here is ignored: Docker Desktop
 * users need none of this, and a broken detection must never be worse than no detection.
 */
def detectedDockerHost = {
    if (System.getenv('DOCKER_HOST')) {
        return null
    }
    try {
        def process = ['docker', 'context', 'inspect', '--format', '{{.Endpoints.docker.Host}}'].execute()
        def host = process.inputStream.text.trim()
        return process.waitFor() == 0 && host.startsWith('unix://') ? host : null
    } catch (Exception ignored) {
        return null
    }
}()

def configureDockerEnvironment = { Test task ->
    if (detectedDockerHost) {
        task.environment 'DOCKER_HOST', detectedDockerHost
        // Ryuk bind-mounts the socket at its conventional path inside the VM, which is
        // where the daemon exposes it regardless of where the host sees it.
        task.environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
    }
}

tasks.named('test') {
    useJUnitPlatform {
        // Throughput measurement is opt-in: ./gradlew perfTest
        excludeTags 'perf'
    }
    // Testcontainers needs a moment on a small Docker VM.
    systemProperty 'junit.jupiter.execution.timeout.default', '5m'
    configureDockerEnvironment(it)
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('perfTest', Test) {
    description = 'Runs the throughput measurement (requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'perf'
    }
    testLogging {
        showStandardStreams = true
    }
    configureDockerEnvironment(it)
    outputs.upToDateWhen { false }
}

jacoco {
    toolVersion = '0.8.14'
}

// Generated DTO/config/bootstrap classes carry no branching logic worth gating on.
def coverageExclusions = [
        '**/CoreBankingApplication.class',
        '**/config/**',
        '**/model/dto/**',
        '**/messaging/event/**',
]

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coverageExclusions)
            })
    )
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coverageExclusions)
            })
    )
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            // Branch sits below the achieved 100% on purpose. The gated set holds only ~32
            // branches, so one uncovered conditional costs about three points — a gate at the
            // current figure would fail on the next legitimate `if`, before its test lands in
            // the same commit. 0.85 is a floor against untested conditionals, not a ratchet.
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
